# Server configuration
server.port=8080
spring.liquibase.enabled=false

# SQL settings on Spring Boot
spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION}

# Supabase database credentials (will be load through a secret store manager)
spring.datasource.url=${DATA_SOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console logging defaults to concise workflow metadata. Override APP_LOG_LEVEL when needed.
logging.level.org.springframework.jdbc.core=INFO
logging.level.web=INFO
logging.level.edu.ai.lms=${APP_LOG_LEVEL:INFO}

# Digital Ocean Cloud Storage
prod.storage.region=${REGION}
prod.storage.end-point=${DO_STORAGE_END_POINT}
prod.storage.access-key=${DO_STORAGE_ACCESS_KEY}
prod.storage.secret-key=${DO_STORAGE_SECRET_KEY}
prod.storage.bucket-name=${DO_STORAGE_BUCKET}

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
