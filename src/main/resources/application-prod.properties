# Server configuration
server.port=8080
spring.liquibase.enabled=false

# SQL settings on Spring Boot
spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION}

# Supabase database credentials (will be load through a secret store manager)
spring.datasource.url=${DATA_SOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging SQL queries for debugging (still use in early production stage)
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.web=DEBUG

# Digital Ocean Cloud Storage
prod.storage.region=${REGION}
prod.storage.end-point=${DO_END_POINT}
prod.storage.access-key=${DO_ACCESS_KEY}
prod.storage.secret-key=${DO_SECRET_KEY}
prod.storage.bucket-name=${DO_BUCKET}

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
