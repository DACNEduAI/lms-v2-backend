# Server configuration
server.port=8080
spring.liquibase.enabled=false

# SQL settings on Spring Boot
spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION}

# Supabase database credentials (will be load through a secret store manager)
spring.datasource.url=${DATA_SOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console logging defaults to concise workflow metadata. Override APP_LOG_LEVEL when needed.
logging.level.org.springframework.jdbc.core=INFO
logging.level.web=INFO
logging.level.edu.ai.lms=${APP_LOG_LEVEL:INFO}

# S3-compatible cloud storage (Supabase Storage)
# STORAGE_S3_* is the canonical configuration used by both dev and prod.
# REGION is retained as a fallback for older DigitalOcean deployments.
prod.storage.region=${STORAGE_S3_REGION:${REGION}}
prod.storage.end-point=${STORAGE_S3_ENDPOINT}
prod.storage.access-key=${STORAGE_S3_ACCESS_KEY_ID}
prod.storage.secret-key=${STORAGE_S3_SECRET_ACCESS_KEY}
prod.storage.bucket-name=${STORAGE_PRIVATE_BUCKET}
quiz.rich-content.public-bucket=${STORAGE_PUBLIC_BUCKET}

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
