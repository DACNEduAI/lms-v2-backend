spring.application.name=lms_platform

# For switching dev/production environment
spring.profiles.active=${PROFILE:dev}

## Database Configuration
spring.datasource.url=${DATA_SOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# All application sessions use UTC. TIMESTAMPTZ values are therefore read/written
# consistently even when the host operating system uses another timezone.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.modulith.events.jdbc.schema=edu

# MyBatis Configuration
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.type-handlers-package=edu.ai.lms.config.mybatis
mybatis.mapper-locations=classpath*:edu/ai/lms/**/adapter/out/persistence/mapper/*Mapper.xml

# JWT Configuration
jwt.secret=${JWT_KEY}
jwt.expiration=${JWT_EXPIRATION}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
quiz.generation.ai.token=${AI_SERVICE_TOKEN:}
ai.service.response-timeout-seconds=${AI_SERVICE_RESPONSE_TIMEOUT_SECONDS:900}
quiz.generation.webhook.base-url=${QUIZ_WEBHOOK_BASE_URL:http://localhost:8080}
quiz.generation.webhook.secret=${QUIZ_WEBHOOK_SECRET:change-me-in-production}
quiz.generation.timeout-minutes=${QUIZ_GENERATION_TIMEOUT_MINUTES:60}
quiz.generation.max-attempts=${QUIZ_GENERATION_MAX_ATTEMPTS:3}
quiz.generation.retention-days=${QUIZ_GENERATION_RETENTION_DAYS:30}
quiz.generation.sse-heartbeat-ms=${QUIZ_GENERATION_SSE_HEARTBEAT_MS:15000}
quiz.visual.max-concurrency=${QUIZ_VISUAL_MAX_CONCURRENCY:5}
quiz.visual.request-timeout-seconds=${QUIZ_VISUAL_REQUEST_TIMEOUT_SECONDS:600}
quiz.visual.lease-safety-margin-seconds=${QUIZ_VISUAL_LEASE_SAFETY_MARGIN_SECONDS:30}
material.indexing.timeout-minutes=${MATERIAL_INDEXING_TIMEOUT_MINUTES:15}
material.indexing.max-attempts=${MATERIAL_INDEXING_MAX_ATTEMPTS:3}

# Shared JSON date format configuration for DTOs and Jackson
app.format.local-date=dd-MM-yyyy
app.format.local-date-time=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false

# Quartz Scheduler Configuration
spring.quartz.job-store-type=jdbc
spring.quartz.auto-startup=${QUARTZ_AUTO_STARTUP:true}
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.overwrite-existing-jobs=false

# 1. Point to the custom SQL script and enable initialization

# the "always" value for quartz schema is only for development purpose, in production it should be "never"
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.schema=classpath:quartz_schema_init.sql

spring.quartz.properties.org.quartz.scheduler.instanceName=lms-attempt-auto-close
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

# 2. Prepend the schema name directly to the table prefix
spring.quartz.properties.org.quartz.jobStore.tablePrefix=quartz_schema.qrtz_

spring.quartz.properties.org.quartz.jobStore.isClustered=${QUARTZ_CLUSTERED:false}
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.threadPool.threadCount=${QUARTZ_THREAD_COUNT:5}

# Disable Spring Modulith persistent event publication to avoid missing EVENT_PUBLICATION table error
spring.modulith.events.jdbc.enabled=false
