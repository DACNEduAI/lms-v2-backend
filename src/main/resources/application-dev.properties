# Server Configuration
server.port=8080
spring.liquibase.enabled=false

# Schema initialization (replaces JPA ddl-auto)

#spring.sql.init.mode=always

spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION:never}


# Console logging defaults to concise workflow metadata. Override APP_LOG_LEVEL when needed.
logging.level.org.springframework.jdbc.core=INFO
logging.level.web=INFO
logging.level.edu.ai.lms=${APP_LOG_LEVEL:INFO}
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI Service Configuration
ai.service.url=http://localhost:8000

# Matches infrastructure/judge0/docker-compose.yml for local development.
# Production keeps requiring an explicitly supplied JUDGE0_AUTH_TOKEN.
code-runner.judge0.auth-token=${JUDGE0_AUTH_TOKEN:lms-local-judge0-token}

# S3-compatible storage for local development (Supabase Storage)
dev.storage.region=${STORAGE_S3_REGION:us-east-1}
dev.storage.access-key=${STORAGE_S3_ACCESS_KEY_ID:test}
dev.storage.secret-key=${STORAGE_S3_SECRET_ACCESS_KEY:test}
dev.storage.end-point=${STORAGE_S3_ENDPOINT:http://localhost:4566}
dev.storage.bucket-name=${STORAGE_PRIVATE_BUCKET:lms-private}
dev.storage.force-path-style=${STORAGE_S3_FORCE_PATH_STYLE:true}
quiz.rich-content.public-bucket=${STORAGE_PUBLIC_BUCKET:lms-public}

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
