# Server Configuration
server.port=8080
spring.liquibase.enabled=false

# Schema initialization (replaces JPA ddl-auto)
spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION}

# Logging SQL queries for debugging
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.web=DEBUG

# AI Service Configuration
ai.service.url=http://localhost:8000

# Local Stack storage for local development
dev.storage.accessKey=test
dev.storage.secretKey=test
dev.storage.endpoint=https://s3.localhost.localstack.cloud:4566
storage.bucket-name=lms-materials

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB