# Server Configuration
server.port=8080
spring.liquibase.enabled=false

# Load local credentials and development overrides automatically when the dev
# profile is active. This keeps protected AI calls authenticated even when the
# backend is started with a plain `mvnw spring-boot:run` command.
spring.config.import=optional:file:.env.dev.properties

# Stable local-only credential. Using the application property directly keeps
# a stale AI_SERVICE_TOKEN inherited by a PowerShell session from overriding
# the token shared with the local AI Pipeline. Production never loads this
# profile and still requires AI_SERVICE_TOKEN from its secret store.
quiz.generation.ai.token=replace-with-a-shared-random-token

# Reset the local edu schema and load schema.sql/data.sql on every backend
# start. Set DATABASE_INITIALIZATION_OPTION=never only when intentionally
# preserving a local database and applying its upgrades separately.
spring.sql.init.mode=${DATABASE_INITIALIZATION_OPTION:always}

# Quartz tables are independent from edu and are recreated for local use.
spring.quartz.jdbc.initialize-schema=always


# Console logging defaults to concise workflow metadata. Override APP_LOG_LEVEL when needed.
logging.level.org.springframework.jdbc.core=INFO
logging.level.web=INFO
logging.level.edu.ai.lms=${APP_LOG_LEVEL:INFO}
# mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# AI Service Configuration
ai.service.url=http://localhost:8000

# Matches infrastructure/judge0/docker-compose.yml for local development.
# Production keeps requiring an explicitly supplied JUDGE0_AUTH_TOKEN.
code-runner.judge0.auth-token=${JUDGE0_AUTH_TOKEN:lms-local-judge0-token}

# S3-compatible storage for local development (Supabase Storage)
dev.storage.region=${STORAGE_S3_REGION:us-east-1}
dev.storage.access-key=${STORAGE_S3_ACCESS_KEY_ID:test}
dev.storage.secret-key=${STORAGE_S3_SECRET_ACCESS_KEY:test}
dev.storage.end-point=${STORAGE_S3_ENDPOINT:http://localhost:4566}
dev.storage.bucket-name=${STORAGE_PRIVATE_BUCKET:lms-private}
dev.storage.force-path-style=${STORAGE_S3_FORCE_PATH_STYLE:true}
quiz.rich-content.public-bucket=${STORAGE_PUBLIC_BUCKET:lms-public}
# Use the same bucket label in material-index records and AI document keys.
material.indexing.bucket=${STORAGE_PRIVATE_BUCKET:lms-private}

# Allow upload files and limit files size
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
