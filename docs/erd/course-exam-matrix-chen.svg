<rect class="note-box" x="55" y="1515" width="2090" height="145" rx="12"/>
<text class="note-title" x="80" y="1545">How to read cardinality</text>
<text class="note" x="80" y="1572">1-N: one parent can relate to many children; each child references at most one parent. N-N: many entities on both sides, implemented here by a junction table.</text>
<text class="note" x="80" y="1598">Nullable FKs are still classified by relationship type, with “optional FK” shown separately. There is no declared 1-1 relationship in this exam-matrix subgraph.</text>
<text class="note" x="80" y="1624">The CHAPTERS N-N LEARNING_OUTCOMES relationship is implemented by CHAPTER_LEARNING_OUTCOMES; EXAM_MATRIX_ROWS independently references both dimensions.</text>
<text class="note" x="80" y="1650">Line colors: red = CASCADE, purple = SET NULL, orange = RESTRICT.</text>
</svg>