# ==========================================================================
#  Deploy Pipeline – Build Docker image & deploy to DigitalOcean Droplet
# ==========================================================================
#
#  Runs after the CI workflow ("Java CI with Maven") succeeds on the
#  main branch.  It builds a Docker image, pushes it to Docker Hub,
#  then SSH-es into the Droplet to pull and run the new image.
#
#  Required GitHub repository **secrets** (Settings → Secrets and variables
#  → Actions → "New repository secret"):
#
#  ┌──────────────────────┬────────────────────────────────────────────┐
#  │ Secret name          │ Description                               │
#  ├──────────────────────┼────────────────────────────────────────────┤
#  │ DOCKERHUB_USERNAME   │ Docker Hub username                       │
#  │ DOCKERHUB_TOKEN      │ Docker Hub access token                   │
#  │ DROPLET_HOST         │ DigitalOcean Droplet public IP address    │
#  │ DROPLET_USERNAME     │ SSH user on the Droplet (e.g. root)       │
#  │ DROPLET_SSH_KEY      │ Private SSH key for the Droplet           │
#  │ DATA_SOURCE          │ PostgreSQL JDBC URL for production        │
#  │ DB_USERNAME          │ PostgreSQL username for production         │
#  │ DB_PASSWORD          │ PostgreSQL password for production         │
#  │ JWT_KEY              │ JWT signing secret                        │
#  │ JWT_EXPIRATION       │ JWT expiration (e.g. 86400000)            │
#  │ REGION               │ DigitalOcean Spaces region                │
#  │ DO_END_POINT         │ DigitalOcean Spaces endpoint URL          │
#  │ DO_ACCESS_KEY        │ DigitalOcean Spaces access key            │
#  │ DO_SECRET_KEY        │ DigitalOcean Spaces secret key            │
#  │ DO_BUCKET            │ DigitalOcean Spaces bucket name           │
#  └──────────────────────┴────────────────────────────────────────────┘
# ==========================================================================

name: Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Java CI with Maven"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/lms-platform

jobs:
  # ------------------------------------------------------------------ #
  #  Build & push Docker image to Docker Hub
  # ------------------------------------------------------------------ #
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ #
  #  Deploy to DigitalOcean Droplet via SSH
  # ------------------------------------------------------------------ #
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Stop and remove the old container (ignore errors if not running)
            docker stop lms-platform || true
            docker rm lms-platform   || true

            # Run the new container with production environment variables
            docker run -d \
              --name lms-platform \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DATA_SOURCE="${{ secrets.DATA_SOURCE }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_KEY="${{ secrets.JWT_KEY }}" \
              -e JWT_EXPIRATION="${{ secrets.JWT_EXPIRATION }}" \
              -e REGION="${{ secrets.REGION }}" \
              -e DO_END_POINT="${{ secrets.DO_END_POINT }}" \
              -e DO_ACCESS_KEY="${{ secrets.DO_ACCESS_KEY }}" \
              -e DO_SECRET_KEY="${{ secrets.DO_SECRET_KEY }}" \
              -e DO_BUCKET="${{ secrets.DO_BUCKET }}" \
              ${{ env.IMAGE_NAME }}:latest

            # Prune old images to free disk space
            docker image prune -af
