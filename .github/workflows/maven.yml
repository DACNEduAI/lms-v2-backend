name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 1. Activate the Environment to access 'vars'
    environment: TestEnv

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # 2. MATCH THE DB NAME: Your DATA_SOURCE var uses 'edu-ai', so we must create that DB
          POSTGRES_DB: edu-ai
          POSTGRES_USER: postgres
          # You can use the variable here too to keep them in sync
          POSTGRES_PASSWORD: ${{ vars.DB_TEST_PASS }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven in dev environment
        # 3. INJECT VARIABLES: Map GitHub 'vars' to the names in application-dev.properties
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          # Mapping DB_TEST_PASS (Github) -> DB_PASSWORD (Spring Boot)
          DB_PASSWORD: ${{ vars.DB_TEST_PASS }}
          JWT_KEY: ${{ vars.JWT_KEY }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
        run: mvn -B package --file pom.xml