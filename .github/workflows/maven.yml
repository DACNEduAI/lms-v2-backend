name: Build and Deploy Core LMS application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. PERMISSIONS: Required for the Test Reporter to write the summary
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile and Package
        run: mvn -B clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    environment: TestEnv
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edu-ai
          POSTGRES_USER: ${{ vars.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ vars.DB_PASS }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 10s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASS }}
          JWT_KEY: ${{ vars.JWT_KEY }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
        run: mvn -B test

      - name: Run Integration Tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASS }}
          JWT_KEY: ${{ vars.JWT_KEY }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
        run: mvn -B verify

      # 2. REPORT UNIT TESTS
      - name: Publish Unit Test Report
        uses: dorny/test-reporter@v1
        if: always()      # Run this even if tests fail!
        with:
          name: Unit Test Results         # Name appearing in GitHub UI
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # 3. REPORT INTEGRATION TESTS
      - name: Publish Integration Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          # Note the different path: 'failsafe-reports'
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: ProdEnv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_PERSONAL_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build Docker image
        run: |
          docker build \
            --build-arg PROFILE=${{ vars.PROFILE }} \
            --build-arg DATA_SOURCE="${{ secrets.DATA_SOURCE }}" \
            --build-arg DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            --build-arg DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --build-arg JWT_KEY="${{ secrets.JWT_KEY }}" \
            --build-arg JWT_EXPIRATION=${{ vars.JWT_EXPIRATION }} \
            --build-arg DATABASE_INITIALIZATION_OPTION=${{ vars.DATABASE_INITIALIZATION_OPTION }} \
            --build-arg REGION=${{ vars.REGION }} \
            --build-arg DO_END_POINT="${{ secrets.DO_STORAGE_END_POINT }}" \
            --build-arg DO_ACCESS_KEY="${{ secrets.DO_STORAGE_ACCESS_KEY }}" \
            --build-arg DO_SECRET_KEY="${{ secrets.DO_STORAGE_SECRET_KEY }}" \
            --build-arg DO_BUCKET="${{ secrets.DO_STORAGE_BUCKET }}" \
            -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/lms-platform:${{ github.sha }} \
            -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/lms-platform:latest \
            .

      - name: Push Docker image
        run: |
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/lms-platform:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/lms-platform:latest

      - name: Deploy the app
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DO_PERSONAL_ACCESS_TOKEN }}
          app_name: edu-ai-backend