name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. PERMISSIONS: Required for the Test Reporter to write the summary
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile and Package
        run: mvn -B clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    environment: TestEnv
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edu-ai
          POSTGRES_USER: ${{ vars.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ vars.DB_PASS }}
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 10s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASS }}
          JWT_KEY: ${{ vars.JWT_KEY }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
        run: mvn -B test

      - name: Run Integration Tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DATA_SOURCE: ${{ vars.DATA_SOURCE }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ vars.DB_PASS }}
          JWT_KEY: ${{ vars.JWT_KEY }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
        run: mvn -B verify

      # 2. REPORT UNIT TESTS
      - name: Publish Unit Test Report
        uses: dorny/test-reporter@v1
        if: always()      # Run this even if tests fail!
        with:
          name: Unit Test Results         # Name appearing in GitHub UI
          path: target/surefire-reports/*.xml
          reporter: java-junit

      # 3. REPORT INTEGRATION TESTS
      - name: Publish Integration Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          # Note the different path: 'failsafe-reports'
          path: target/failsafe-reports/*.xml
          reporter: java-junit